name: Security Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security check every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  php-security-checks:
    name: PHP 8.4 Syntax & Security Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, sodium, curl, pdo, pdo_mysql
          tools: php-cs-fixer

      - name: Validate PHP syntax in examples
        run: |
          echo "Scanning all PHP examples for syntax correctness..."
          find examples -name "*.php" -print0 | xargs -0 -n 1 php -l

      - name: Check for deprecated security practices
        run: |
          echo "Verifying no deprecated patterns exist..."
          # Fail if md5 or sha1 are used in auth examples inappropriately
          ! grep -rn "md5(" examples/AuthenticationExamples.php
          ! grep -rn "sha1(" examples/AuthenticationExamples.php
          # Fail if deprecated X-XSS-Protection is enabled
          ! grep -rn "'1; mode=block'" examples/Laravel/Middleware/SecureHeaders.php

  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Documentation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check markdown files integrity
        run: |
          echo "Verifying all markdown guides exist..."
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f docs/checklist.md
          test -f docs/checklist.ar.md
          test -f docs/01-foundations/php-security.md
          test -f docs/01-foundations/laravel-security.md
          test -f docs/02-authentication/password-handling.md
          test -f docs/04-api-security/api-security-basics.md
          test -f docs/05-ai-security/prompt-injection-defense.md
          test -f docs/06-deployment/secure-headers.md
          echo "All documentation files validated successfully."
