name: Bug Report
description: Report an incorrect code example, security vulnerability inaccuracy, or documentation issue.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the **Laravel AI Security Masterclass**!
        
        > **Note:** If this is a sensitive security vulnerability in this repo, please report it via [Private Security Advisories](https://github.com/Umar-444/Laravel-AI-Security-Masterclass/security/advisories/new) or email `contact@itsumarfarooq.com`.
  - type: input
    id: file-location
    attributes:
      label: File or Documentation Path
      description: Which file contains the issue? (e.g., `docs/05-ai-security/prompt-injection-defense.md`)
      placeholder: docs/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: What is incorrect or broken?
      placeholder: Explain what is inaccurate or what error occurs.
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested Fix (Optional)
      description: How should this code or explanation be corrected?
      placeholder: Provide the corrected snippet or reference to official documentation.
