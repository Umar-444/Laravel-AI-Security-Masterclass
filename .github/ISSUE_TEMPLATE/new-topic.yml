name: Suggest New Security Topic / Feature
description: Propose a new security guide, AI threat mitigation pattern, or code example.
labels: ["enhancement", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new topic for the **Laravel AI Security Masterclass**!
  - type: input
    id: topic-title
    attributes:
      label: Topic Title
      description: What security topic or pattern should be covered?
      placeholder: e.g., Securing Laravel Reverb WebSockets with Redis ACL
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "01 - Foundations"
        - "02 - Authentication & Authorization"
        - "03 - Input Validation & Attacks"
        - "04 - API Security"
        - "05 - AI & LLM Security"
        - "06 - Deployment & Hardening"
        - "Regional / Compliance (PDPL, GDPR, etc.)"
    validations:
      required: true
  - type: textarea
    id: threat-model
    attributes:
      label: Threat Model & Context
      description: What attack or vulnerability does this topic address in production Laravel applications?
    validations:
      required: true
  - type: textarea
    id: official-sources
    attributes:
      label: Official Sources & Documentation
      description: Link official standards (OWASP, NIST, Laravel Docs, PHP manual) supporting this pattern.
    validations:
      required: false
